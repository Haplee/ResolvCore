<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!--
    Favicon simplificado de ResolveCore.
    Variante para tamanos pequenos (16/32px): sin el contorno negro fino del
    logo principal, trazos mas gruesos y colores solidos sobre fondo oscuro
    redondeado, para que la marca C+R se lea nitida en la pestana del navegador.
    El logo completo (resolvcore-icon.svg) se sigue usando en tamanos grandes.
  -->
  <rect x="0" y="0" width="100" height="100" rx="22" ry="22" fill="#0d0f13" />

  <!-- C (plata) -->
  <path d="M 68,24 A 32,32 0 1,0 68,76" fill="none" stroke="#cfd4e0" stroke-width="11" stroke-linecap="round" />

  <!-- R (verde de marca) -->
  <path d="M 40,22 L 40,78" fill="none" stroke="#00e5a0" stroke-width="11" stroke-linecap="round" />
  <path d="M 40,31 H 63 C 77,31 77,54 63,54 H 40" fill="none" stroke="#00e5a0" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 56,54 L 78,78" fill="none" stroke="#00e5a0" stroke-width="11" stroke-linecap="round" />
</svg>
